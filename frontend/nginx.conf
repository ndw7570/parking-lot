server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt webroot 챌린지. 인증서 발급·갱신 때만 쓰인다.
    # 미리 둬도 무해하고, 없으면 발급 시점에 재빌드를 한 번 더 해야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 서비스워커와 셸은 캐시하지 않는다. 이 둘이 캐시되면 새 버전을 올려도 구버전이
    # 계속 뜬다. 아래 /assets/ 가 immutable 30일이라 특히 위험하다 — 해시가 박힌
    # 산출물만 그 규칙을 받아야 한다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx 의 mime.types 에 .webmanifest 가 없어 octet-stream 으로 나간다.
        # 그러면 브라우저가 매니페스트를 무시해 '홈 화면에 추가'가 뜨지 않는다.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy API + auth to the Django backend so the browser is same-origin
    # (no CORS). The "backend" host is the docker-compose service name.
    location /api/ {
        # 무단주차 신고 사진(P005-025). 기본 1MB 면 큰 사진이 413 으로 막힌다. 서버 API 상한은 5MB.
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /users/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Android 앱(APK). internal 이라 직접 열 수 없고, 백엔드가 로그인 확인 후 발급한 서명 링크로만
    # 나간다(X-Accel-Redirect). nginx.ssl.conf 와 같은 블록이다.
    location ~ ^/protected-downloads/(?<apk_file>[^/]+\.apk)$ {
        internal;
        alias /srv/downloads/$apk_file;
        # mime.types 에 apk 가 없어 octet-stream 으로 나가면 일부 폰이 설치 파일로 인식하지 않는다.
        types { application/vnd.android.package-archive apk; }
        # add_header 는 성공 응답에만 붙는다. 파일이 없을 때(404) 첨부 헤더가 붙으면 브라우저가
        # 오류 문구 대신 "사이트에 연결할 수 없음"을 띄운다(실제 발생). 그래서 여기서만 붙인다.
        add_header Content-Disposition 'attachment; filename="$apk_file"';
        add_header Cache-Control "no-store";
        error_page 404 = @apk_missing;
    }
    location @apk_missing {
        default_type "text/plain; charset=utf-8";
        return 404 "앱 파일이 아직 서버에 없습니다. 관리자에게 알려 주세요.";
    }
}

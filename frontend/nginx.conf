server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt webroot 챌린지. 인증서 발급·갱신 때만 쓰인다.
    # 미리 둬도 무해하고, 없으면 발급 시점에 재빌드를 한 번 더 해야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API + auth to the Django backend so the browser is same-origin
    # (no CORS). The "backend" host is the docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /users/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

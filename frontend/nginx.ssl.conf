# HTTPS 용 nginx 설정. 인증서를 발급한 뒤에 쓴다.
#
# compose 에서 이 파일을 default.conf 자리에 마운트한다:
#   volumes:
#     - ./frontend/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
#
# 인증서가 없는 상태로 이 설정을 올리면 nginx 가 기동에 실패한다.
# 발급 절차는 README 또는 인수인계 문서를 볼 것.

# 80 은 ACME 챌린지만 받고 나머지는 443 으로 보낸다.
server {
    listen 80;
    server_name dhwj2497.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dhwj2497.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dhwj2497.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhwj2497.duckdns.org/privkey.pem;

    # TLS 1.2 미만은 받지 않는다. 구형 브라우저를 버리는 대신 알려진 약점을 덜어낸다.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 와 /users 를 백엔드로 넘긴다. TLS 는 여기서 끊고 내부는 평문이다.
    # X-Forwarded-Proto 를 넘겨야 Django 가 자신을 https 로 인식한다
    # (settings.py 의 SECURE_PROXY_SSL_HEADER 와 짝이다).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /users/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

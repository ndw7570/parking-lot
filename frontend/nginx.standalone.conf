server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 서비스워커와 셸은 캐시하지 않는다. 이 둘이 캐시되면 새 버전을 올려도 구버전이
    # 계속 뜬다. 아래 /assets/ 가 immutable 30일이라 특히 위험하다 — 해시가 박힌
    # 산출물만 그 규칙을 받아야 한다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx 의 mime.types 에 .webmanifest 가 없어 octet-stream 으로 나간다.
        # 그러면 브라우저가 매니페스트를 무시해 '홈 화면에 추가'가 뜨지 않는다.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Optional backend proxy for standalone runs.
    #
    # Unlike nginx.conf, the upstream is passed through a variable so nginx
    # resolves "backend" lazily at request time via Docker's embedded DNS
    # (127.0.0.11). This means the container STARTS even when no backend
    # service exists on the network — /api and /users just return 502 until a
    # reachable "backend" host appears. Override the target with BACKEND_ORIGIN
    # or point the SPA elsewhere via VITE_API_BASE at build time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://namddww.iptime.org:5174;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /users/ {
        set $upstream_users http://namddww.iptime.org:5174;
        proxy_pass $upstream_users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
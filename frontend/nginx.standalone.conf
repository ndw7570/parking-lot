server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional backend proxy for standalone runs.
    #
    # Unlike nginx.conf, the upstream is passed through a variable so nginx
    # resolves "backend" lazily at request time via Docker's embedded DNS
    # (127.0.0.11). This means the container STARTS even when no backend
    # service exists on the network — /api and /users just return 502 until a
    # reachable "backend" host appears. Override the target with BACKEND_ORIGIN
    # or point the SPA elsewhere via VITE_API_BASE at build time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://namddww.iptime.org:5174;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /users/ {
        set $upstream_users http://namddww.iptime.org:5174;
        proxy_pass $upstream_users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}